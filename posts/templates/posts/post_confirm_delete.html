{% extends 'posts/base.html' %}

{% block title %}Delete Post{% endblock %}

{% block content %}
<h2>Are you sure you want to delete "{{ post.title }}"?</h2>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
</form>
<br>
<a href="{% url 'post_list' %}">Cancel</a>
{% endblock %}
